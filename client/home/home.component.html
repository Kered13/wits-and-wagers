<mat-card style="max-width: 400px;">
	<mat-card-header>
		<h1>Wits & Wagers</h1>
	</mat-card-header>
	<mat-card-content>
		<mat-form-field>
			<mat-label>Username:</mat-label>
			<input matInput placeholder="Username" type="text" [(ngModel)]="username" />
		</mat-form-field>
		<mat-form-field>
			<mat-label>Join Code:</mat-label>
			<input matInput
				placeholder="Join Code"
				type="text"
				oninput="this.value = this.value.toUpperCase()"
				[(ngModel)]="joinCode" />
		</mat-form-field>
	</mat-card-content>
	<mat-card-actions>
		<button mat-raised-button (click)="onHostGame()" [disabled]="!username">Host Game</button>
		<button mat-raised-button (click)="onJoinGame()" [disabled]="!username || !joinCode">Join Game</button>
	</mat-card-actions>
</mat-card>
