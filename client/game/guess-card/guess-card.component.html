@let guessVal = data();
@if (typeof(guessVal.value) === "number") {
	@if (isSpectator()) {
		<mat-icon class="spec-icon">visibility</mat-icon>
	}
	<span class="guess-value" [fittext]="true" [modelToWatch]="guessVal">
		{{ formattedValue(guessVal.value) }}
	</span>
} @else {
	<div class="card-back"></div>
}
