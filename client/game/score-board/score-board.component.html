@for (player of players(); track player.color) {
	<div class="player">
		<mat-icon class="icon" [style.color]="colorFor(player)">
			{{ player.color ? "person" : "visibility" }}
		</mat-icon>
		<div class="name">
			<span [fittext]="true" [modelToWatch]="player">
				{{ player.name }}
			</span>
		</div>
		<div class="chips">
			<span [fittext]="true" [modelToWatch]="player">
				${{ player.chips }}
			</span>
		</div>
	</div>
}
