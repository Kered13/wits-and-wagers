<div style="display: flex; justify-content: center">
	@for(player of game().players; track player.publicId) {
		<mat-card style="max-width: 400px;">
			<mat-card-header>
				<h1>{{ player.name }}</h1>
			</mat-card-header>
			<mat-card-content>
				<h2>Counter: </h2>
			</mat-card-content>
			@if (thisPlayer().publicId === player.publicId) {
				<mat-card-actions>
				</mat-card-actions>
			}
		</mat-card>
	}
</div>
