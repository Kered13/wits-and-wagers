<div class="wager-box"
		[style.--background-color]="color()"
		[class.enabled]="!disabled()"
		(click)="click()">
	<ng-content />
	<ng-content select="wager-box-bg-text" />
	@for (bet of bets(); track bet.color) {
		<betting-chip [value]="bet.value" [color]="bet.color" [style.inset]="chipPositions()[$index]" />
	}
	<span class="bottom-text">
		<ng-content select="wager-box-bottom-text" />
	</span>
</div>
