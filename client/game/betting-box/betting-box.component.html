<div class="inner-box" [style.background-color]="color()">
	@if (guess() !== undefined) {
		<div class="guess-card" [style.border-color]="guess()!.color"></div>
	}
	@for (bet of bets(); track bet.color) {
		<div class="bet-chip"
			[style.inset]="chipPositions()[$index]"
			[style.border-color]="bet.color">
			<span class="bet-quantity">{{ bet.value }}</span>
		</div>
	}
</div>
