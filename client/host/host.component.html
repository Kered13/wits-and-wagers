<form [formGroup]="options" (ngSubmit)="createLobby()">
	<mat-card style="max-width: 400px;">
		<mat-card-header>
			<h1>Host Game</h1>
		</mat-card-header>
		<mat-card-content>
			<mat-form-field>
				<mat-label>Title:</mat-label>
				<input matInput placeholder="Game Name" type="text" formControlName="title" />
			</mat-form-field>
		</mat-card-content>
		<mat-card-actions>
			<button mat-raised-button type="submit" [disabled]="!options.valid">Host Game</button>
		</mat-card-actions>
	</mat-card>
</form>
