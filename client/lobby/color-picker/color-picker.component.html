@if (disabled()) {
	<div class="color-box" [style.background-color]="player().color"></div>
} @else {
	<button class="host-action-button"
			#tooltip="matTooltip"
			matTooltip="Change color"
			(click)="toggleColorPicker()"
			cdkOverlayOrigin #trigger="cdkOverlayOrigin"
			mat-mini-fab>
		<div class="color-box" [style.background-color]="player().color"></div>
	</button>
	<ng-template cdkConnectedOverlay
			[cdkConnectedOverlayOrigin]="trigger"
			[cdkConnectedOverlayOpen]="isOpen"
			(overlayOutsideClick)="closeColorPicker()"
			(detach)="closeColorPicker()">
		<div class="color-picker">
			@for (color of COLORS; track $index) {
				<color-button [color]="color"
					[disabled]="color !== player().color && !isColorAvailable(color)"
					(click)="setColor(color); closeColorPicker()">
				</color-button>
			}
		</div>
	</ng-template>
}
