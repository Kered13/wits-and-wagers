<mat-card style="max-width: 400px;">
	<mat-card-header>
		<h1>Counter: {{ counter }}</h1>
	</mat-card-header>
	<mat-card-actions>
		<button mat-raised-button (click)="onAddOne()" style="margin-right: 8px">Add 1!</button>
		<button mat-raised-button (click)="onReset()">Reset</button>
	</mat-card-actions>
</mat-card>
